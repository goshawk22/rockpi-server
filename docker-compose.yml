version: '2'

services:
  tailscale:
    # where <arch> is one of aarch64, armv7hf or amd64
    image: bh.cr/gh_klutchell/tailscale-aarch64
    network_mode: host
    restart: on-failure
    volumes:
      - ts-state:/var/lib/tailscale
    labels:
      - io.balena.features.kernel-modules=1
    cap_add:
      - net_admin
      - sys_module
    tmpfs:
      - /tmp
      - /var/run/

  wsprd:
    build:
      context: ./rtlsdr-wsprd
    container_name: wsprd-hackrf
    user: "0:0"
    restart: unless-stopped
    environment:
      TZ: Europe/London
      WSPR_BAND: 17m
      WSPR_CALLSIGN: M7GAQ/RX
      WSPR_LOCATOR: IO90wx
      WSPR_GAIN: 32
      WSPR_RF_AMP: 0
      WSPR_FREQ_SHIFT: 0
      WSPR_PPM: 0
      WSPR_DEVICE_INDEX: 0
    devices:
      - /dev/bus/usb:/dev/bus/usb
    tmpfs:
      - /tmp:mode=1777

volumes:
  watchdog-log:
  ts-state: {}
